# Render blueprint — deploys the Samaritan Torah web app straight from the git repo.
# On render.com: New → Blueprint → connect this repo. Render reads this file and
# builds/runs the web service. Starter plan = always-on (no sleep / cold-start),
# so the app responds instantly and a custom domain stays live.
services:
  - type: web
    name: samaritan-torah
    runtime: python
    plan: starter
    region: frankfurt          # closest free region to Israel (much lower latency)
    # install ONLY Flask + gunicorn (not the phone-app's Kivy requirements)
    buildCommand: pip install -r web/requirements-prod.txt
    startCommand: gunicorn web.server:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      # admin panel (hamburger menu → כניסת מנהל) + visit analytics. ADMIN_PASSWORD
      # is a secret: set its value once in the Render dashboard (Environment tab) —
      # it is never stored in this file or in git. Leaving it unset keeps the admin
      # panel disabled, same as a local checkout with no .env.
      - key: ADMIN_USER
        value: oshersa
      - key: ADMIN_PASSWORD
        sync: false
      # persistent disk so online admin edits + the visit-analytics log survive
      # across deploys instead of resetting with the ephemeral container disk
      - key: DB_PATH
        value: /var/data/torah.db
      - key: ANALYTICS_DB_PATH
        value: /var/data/analytics.db
    disk:
      name: torah-data
      mountPath: /var/data
      sizeGB: 1

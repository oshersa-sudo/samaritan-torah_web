# מפרסם את אפליקציית לימוד האנגלית (english-app) ל-GitHub Pages.
# לאחר ההרצה הראשונה, האפליקציה תהיה זמינה בכתובת:
#   https://<user>.github.io/<repo>/   (למשל https://oshersa-sudo.github.io/samaritan-torah_web/)
# הפעלה חד-פעמית: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy English App to Pages

on:
  push:
    branches: [claude/english-learning-app-d5kqu1]
    paths: ["english-app/**", ".github/workflows/deploy-english-app.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload english-app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: english-app
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build Android TWA

# The Trusted Web Activity wrapper around the web edition
# (https://samaritan-torah.onrender.com). Separate from build-android.yml, which
# builds the standalone Kivy app — the two are different packages and can be
# installed side by side.

on:
  push:
    tags:
      - 'twa-v*'
  workflow_dispatch:

permissions:
  contents: write        # needed to attach the APK/AAB to the release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Bubblewrap validates the JDK by reading its `release` file and insists on
      # 17.0.x — newer JDKs are rejected outright, so pin it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.25.0

      # Bubblewrap 1.25 generates a project with compileSdk/targetSdk 36 and
      # signs with build-tools 36.1.0. Install both up front rather than letting
      # Bubblewrap try to fetch them mid-build.
      - name: Install the required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      # Bubblewrap validates the SDK root by requiring a legacy `tools/` or `bin/`
      # directory. Modern SDK installs — including the runner image — have neither,
      # so `bubblewrap build` dies with "The provided androidSdk isn't correct."
      # Linking sdkmanager into `bin/` satisfies the check, and is also exactly
      # where Bubblewrap looks for it if it ever needs to install build-tools.
      - name: Give Bubblewrap the SDK layout it expects
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/bin"
          ln -sf "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                 "$ANDROID_SDK_ROOT/bin/sdkmanager"

      - name: Point Bubblewrap at the runner's JDK and Android SDK
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' \
            "$JAVA_HOME" "$ANDROID_SDK_ROOT" > ~/.bubblewrap/config.json

      - name: Restore the signing keystore
        run: |
          if [ -z "${{ secrets.TWA_KEYSTORE_BASE64 }}" ]; then
            echo "::error::TWA_KEYSTORE_BASE64 is not set — see twa/README.md for how to create the key."
            exit 1
          fi
          echo "${{ secrets.TWA_KEYSTORE_BASE64 }}" | base64 -d > twa/android.keystore

      # `update` regenerates the Android project from twa-manifest.json;
      # --skipVersionUpgrade keeps it non-interactive (otherwise it asks for a
      # new version name). `build` then assembles and signs the APK and the AAB.
      - name: Build and sign
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade
          bubblewrap build

      - name: Show the signing fingerprint
        working-directory: twa
        run: |
          echo "Put this SHA-256 in TWA_FINGERPRINTS on Render (see twa/README.md):"
          keytool -list -v -keystore android.keystore -alias torah \
                  -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -i "SHA256:" || true
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: samaritan-torah-twa
          path: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

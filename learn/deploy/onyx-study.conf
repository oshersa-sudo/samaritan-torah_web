# Nginx reverse proxy for the onyx-study.com learning app (trainer + backend).
# Copy to /etc/nginx/sites-available/onyx-study and enable:
#   sudo cp learn/deploy/onyx-study.conf /etc/nginx/sites-available/onyx-study
#   sudo ln -s /etc/nginx/sites-available/onyx-study /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then add HTTPS (certbot rewrites this file for you):
#   sudo certbot --nginx -d onyx-study.com -d www.onyx-study.com

# ⚠️ For a DEDICATED server only. On the SHARED onyx-study VPS use
#    learn/deploy/onyx-trainer.nginx.conf instead (no default_server), so the
#    existing apps (onyx, tasks, media, foodorder…) are never disturbed.
server {
    listen 80;
    listen [::]:80;
    server_name onyx-study.com www.onyx-study.com;

    # static assets straight from nginx (vocab_en.js is ~130 KB — cache it)
    location /static/ {
        alias /var/www/onyx-study/learn/static/;
        expires 7d;
        access_log off;
    }

    # the trainer, the API, and the parent portal all proxy to gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 2m;
}

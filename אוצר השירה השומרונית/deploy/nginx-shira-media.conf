# אוצר השירה השומרונית — שרת המדיה (Contabo 194.163.130.39)
#
# מגיש רק את קבצי השמע. האפליקציה עצמה יושבת במקום אחר (שרת התורה השומרונית),
# ולכן צריך כאן CORS ותמיכה מלאה ב-Range — הנגן קופץ באמצע קובץ.
#
#   sudo cp nginx-shira-media.conf /etc/nginx/sites-available/shira-media
#   sudo ln -s /etc/nginx/sites-available/shira-media /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d __HOST__
#
# ⚠ שרת פרודקשן משותף: אין לגעת ב-vhosts של האפליקציות האחרות.

server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    root /srv/shira;
    autoindex off;                 # הארכיון לא נגלש כעץ תיקיות

    access_log /var/log/nginx/shira-media.access.log;
    error_log  /var/log/nginx/shira-media.error.log;

    # שמע: קריאה בלבד, נשמר במטמון לזמן ארוך — קובץ לא משתנה אחרי שהועלה
    location /archive/ {
        # להאזנה בתוך האפליקציה, לא להורדה. בקשה שלא הגיעה מדף של האפליקציה
        # נדחית, ולכן כתובת שהודבקה בשורת הכתובת או במוריד קבצים מחזירה 403.
        # זה עוצר הורדה מזדמנת והצמדת קישורים מאתרים אחרים; מי שמנגן בדפדפן
        # מקבל בהכרח את הבתים עצמם, ואת זה שום הגדרת שרת לא משנה.
        valid_referers samaritan-torah.onrender.com;
        if ($invalid_referer) { return 403; }
        add_header Content-Disposition "inline" always;

        add_header Access-Control-Allow-Origin  "*"            always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range"        always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        if ($request_method = OPTIONS) { return 204; }

        # Range עובד מעצמו על קבצים סטטיים; אלה רק מכוונים את הזרימה
        sendfile     on;
        tcp_nopush   off;
        tcp_nodelay  on;
        gzip         off;

        try_files $uri =404;
    }

    # בדיקת חיים — כדי לוודא מהאפליקציה שהשרת חי בלי למשוך קובץ שמע
    location = /health {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 200 '{"ok":true,"service":"shira-media"}';
    }

    location / { return 404; }
}

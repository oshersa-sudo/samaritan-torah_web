# New, ISOLATED nginx site for the trainer on the shared onyx-study VPS.
# Copy to /etc/nginx/sites-available/onyx-trainer  (a NEW file — never edit
# or overwrite the existing site files of onyx / tasks / media / foodorder).
# No default_server here, so existing apps are untouched.
#
#   sudo cp web/deploy/onyx-trainer.nginx.conf /etc/nginx/sites-available/onyx-trainer
#   sudo ln -s /etc/nginx/sites-available/onyx-trainer /etc/nginx/sites-enabled/onyx-trainer
#   sudo nginx -t && sudo systemctl reload nginx        # reload, NOT restart
#   sudo certbot --nginx -d learn.onyx-study.com        # only the new subdomain

server {
    listen 80;
    listen [::]:80;
    server_name learn.onyx-study.com;          # ← change if you pick another subdomain

    location /static/ {
        alias /root/onyx-trainer/web/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;      # the pm2 app's port
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 2m;
}
